<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B1C1E">
<title>설정 — MIRAI</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-jp.min.css">
<link rel="stylesheet" href="../shared/styles.css">
<style>
/* 페이지 컨테이너 — .app grid는 shared/styles.css에서 처리 */
.content-wrap main{max-width:920px;margin:0 auto}
main{
  padding:0 16px calc(72px + env(safe-area-inset-bottom));
}

/* 페이지 헤더 (← 뒤로 + 타이틀) */
.settings-pageheader{
  display:flex;align-items:center;gap:8px;
  height:56px;margin-bottom:8px;
}
.settings-back{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  color:var(--label-normal);
  background:transparent;border:none;cursor:pointer;
  transition:opacity 0.15s ease;
  margin-left:-8px;
}
.settings-back:hover{opacity:0.7}
.settings-back:active{opacity:0.5}
.settings-back svg{width:24px;height:24px}
.settings-pagetitle{
  font-size:17px;font-weight:600;line-height:1.412;
  color:var(--label-strong);
  letter-spacing:-0.002em;
}

/* 그룹 헤더 */
.settings-group{margin-bottom:24px}
.settings-group-title{
  font-size:13px;font-weight:600;line-height:1.45;
  color:var(--label-alternative);
  letter-spacing:0.0252em;
  text-transform:uppercase;
  padding:0 4px 10px;
}

/* 행(카드) */
.settings-list{display:flex;flex-direction:column;gap:8px}
.settings-card{
  position:relative;
  display:flex;align-items:center;gap:14px;
  padding:14px;
  border-radius:14px;
  background:var(--fill-alternative);
  cursor:pointer;
  text-decoration:none;
  color:inherit;
  transition:background 0.15s ease;
}
.settings-card:hover{background:var(--fill-normal)}
.settings-card-icon{
  width:40px;height:40px;
  border-radius:50%;
  background:var(--fill-normal);
  display:flex;align-items:center;justify-content:center;
  color:var(--label-normal);
  flex-shrink:0;
}
.settings-card-icon svg{width:20px;height:20px}
.settings-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.settings-card-label{
  font-size:15px;font-weight:500;line-height:1.35;
  color:var(--label-strong);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-0.002em;
}
.settings-card-desc{
  font-size:13px;font-weight:400;line-height:1.4;
  color:var(--label-alternative);
  letter-spacing:0.0145em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.settings-card-trailing{
  display:flex;align-items:center;gap:6px;
  flex-shrink:0;
  color:var(--label-alternative);
}
.settings-card-value{
  font-size:13px;font-weight:500;
  color:var(--label-alternative);
  letter-spacing:0.0145em;
}
.settings-card-badge{
  height:22px;padding:0 9px;
  border-radius:999px;
  background:var(--primary-normal);
  color:#fff;
  font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;
  letter-spacing:0.0145em;
}
.settings-card-chevron{
  width:18px;height:18px;
  color:var(--label-assistive);
}
.settings-card-chevron svg{width:18px;height:18px}

/* 토글 */
.settings-toggle{
  width:48px;height:28px;
  border-radius:999px;
  background:var(--fill-normal);
  position:relative;
  cursor:pointer;
  flex-shrink:0;
  transition:background 0.2s ease;
  border:none;
}
.settings-toggle::after{
  content:'';
  position:absolute;left:2px;top:2px;
  width:24px;height:24px;
  border-radius:50%;
  background:#fff;
  transition:transform 0.2s ease;
}
.settings-toggle.on{background:var(--primary-normal)}
.settings-toggle.on::after{transform:translateX(20px)}

/* 로그아웃 카드 */
.settings-card.danger .settings-card-icon{
  background:rgba(255,99,99,0.12);
  color:var(--status-negative);
}
.settings-card.danger .settings-card-label{color:var(--status-negative)}

@media (max-width:768px){
  main{padding:0 16px calc(72px + env(safe-area-inset-bottom))}
  /* 설정 페이지는 자체 헤더(뒤로+제목)가 있으므로 글로벌 헤더 숨김 */
  mirai-header,
  mirai-header > .header{display:none}
}
</style>
<script src="../shared/components.js" defer></script>
</head>
<body>
<div class="app">

<mirai-sidebar></mirai-sidebar>

<div class="content-wrap">

<mirai-header></mirai-header>

<main>
  <header class="settings-pageheader">
    <button class="settings-back" aria-label="뒤로" onclick="history.length > 1 ? history.back() : location.href='mypage.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <h1 class="settings-pagetitle">설정</h1>
  </header>

  <!-- 일반 -->
  <section class="settings-group">
    <div class="settings-group-title">일반</div>
    <div class="settings-list">
      <div class="settings-card">
        <div class="settings-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
        </div>
        <div class="settings-card-body">
          <div class="settings-card-label">세이프티 필터</div>
        </div>
        <button class="settings-toggle on" data-toggle aria-checked="true" aria-label="세이프티 필터"></button>
      </div>
      <a href="#" class="settings-card">
        <div class="settings-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <div class="settings-card-body">
          <div class="settings-card-label">언어</div>
        </div>
        <div class="settings-card-trailing">
          <span class="settings-card-value">한국어</span>
          <span class="settings-card-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
        </div>
      </a>
    </div>
  </section>

  <!-- 계정 -->
  <section class="settings-group">
    <div class="settings-group-title">계정</div>
    <div class="settings-list">
      <a href="#" class="settings-card">
        <div class="settings-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 9V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/>
            <path d="M3 9h18l-1 11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2L3 9z"/>
            <line x1="12" y1="13" x2="12" y2="18"/>
          </svg>
        </div>
        <div class="settings-card-body">
          <div class="settings-card-label">크리에이터 수익</div>
        </div>
        <span class="settings-card-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>
      <a href="#" class="settings-card">
        <div class="settings-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="settings-card-body">
          <div class="settings-card-label">친구 초대</div>
        </div>
        <div class="settings-card-trailing">
          <span class="settings-card-badge">200미르 받기</span>
          <span class="settings-card-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
        </div>
      </a>
      <a href="#" class="settings-card">
        <div class="settings-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
          </svg>
        </div>
        <div class="settings-card-body">
          <div class="settings-card-label">차단 관리</div>
        </div>
        <span class="settings-card-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>
    </div>
  </section>

  <!-- 정책 -->
  <section class="settings-group">
    <div class="settings-group-title">정책</div>
    <div class="settings-list">
      <a href="#" class="settings-card" target="_blank" rel="noopener">
        <div class="settings-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="15" y2="17"/>
          </svg>
        </div>
        <div class="settings-card-body">
          <div class="settings-card-label">개인정보 처리방침</div>
        </div>
        <span class="settings-card-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>
      <a href="#" class="settings-card" target="_blank" rel="noopener">
        <div class="settings-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <div class="settings-card-body">
          <div class="settings-card-label">서비스 이용약관</div>
        </div>
        <span class="settings-card-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>
    </div>
  </section>

  <!-- 로그아웃 -->
  <section class="settings-group">
    <div class="settings-list">
      <a href="#" class="settings-card danger" id="logoutBtn">
        <div class="settings-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </div>
        <div class="settings-card-body">
          <div class="settings-card-label">로그아웃</div>
        </div>
      </a>
    </div>
  </section>
</main>

</div>
</div>

<mirai-bottom-nav active="mypage"></mirai-bottom-nav>

<script>
// 토글 핸들러
document.querySelectorAll('[data-toggle]').forEach(t => {
  t.addEventListener('click', () => {
    t.classList.toggle('on');
    t.setAttribute('aria-checked', t.classList.contains('on'));
  });
});

// 로그아웃 — guest=1 저장 + 홈으로 이동
document.getElementById('logoutBtn')?.addEventListener('click', e => {
  e.preventDefault();
  if (!confirm('로그아웃하시겠습니까?')) return;
  try { localStorage.setItem('mirai.guest', '1'); } catch(err){}
  location.href = 'index.html';
});
</script>
</body>
</html>
